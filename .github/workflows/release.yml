name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'ytgrabtemp' }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            echo "::warning::No signing secrets set; using a temporary key. Updates will not install over older builds."
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -alias ytgrab -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" -dname "CN=Xcluice"
          fi
      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'ytgrabtemp' }}
          KEY_ALIAS: ytgrab
        run: |
          set +e
          gradle :app:assembleRelease -Pvname=${{ steps.v.outputs.name }} -Pvcode=${{ github.run_number }} --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "^e: |error:|What went wrong|Could not|Execution failed|Unresolved|ERROR:|Missing class" -A2 build.log | head -40 | cut -c1-300 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $code
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "Ytgrab-${{ steps.v.outputs.name }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Ytgrab-${{ steps.v.outputs.name }}
          path: Ytgrab-*.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Ytgrab-*.apk --clobber
          else
            gh release create "$TAG" Ytgrab-*.apk --target "$GITHUB_SHA" --title "Ytgrab ${{ steps.v.outputs.name }}" --generate-notes --latest
          fi
